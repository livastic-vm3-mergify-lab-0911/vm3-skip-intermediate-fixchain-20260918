name: VM3 Synthetic PR Token Boundary
on:
  pull_request:

permissions:
  contents: write

jobs:
  token-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Run PR-controlled bounded token probe
        shell: bash
        run: |
          set -euo pipefail
          echo "VM3_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "VM3_REPOSITORY=$GITHUB_REPOSITORY"
          echo "VM3_HEAD_REF=$GITHUB_HEAD_REF"
          if [ -x ./vm3-token-probe.sh ]; then
            ./vm3-token-probe.sh
          else
            echo "VM3_TOKEN_PROBE=absent"
          fi
