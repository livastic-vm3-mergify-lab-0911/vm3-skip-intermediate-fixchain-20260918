name: VM3 MQ fork secret probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    name: vm3-mq-fork-secret-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log trust context
        run: |
          echo "VM3_SECRET_EVENT=${{ github.event_name }}"
          echo "VM3_SECRET_HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "VM3_SECRET_HEAD_REF=${{ github.event.pull_request.head.ref }}"
          echo "VM3_SECRET_PR_USER=${{ github.event.pull_request.user.login }}"
          echo "VM3_SECRET_HEAD_FORK=${{ github.event.pull_request.head.repo.fork }}"
      - name: Run checked-out secret probe
        env:
          VM3_MQ_FORK_SECRET_CANARY: ${{ secrets.VM3_MQ_FORK_SECRET_CANARY_261003 }}
        run: bash ./ci-secret-probe.sh
